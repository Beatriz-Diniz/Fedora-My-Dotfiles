# teste para ver se diminui uso de GPU, 
# quando mudar para um PC com GPU Nvidia, talvez
# o código acima funcione
animations {
    enabled = yes

    # Esta é uma curva "elástica" (overshoot) que dá uma sensação fluida
    bezier = fluid, 0.05, 0.9, 0.1, 1.05

    # Aumentamos o speed de 3 para 5 (mais lento = mais suave)
    animation = windows, 1, 5, fluid, slide
    animation = windowsIn, 1, 5, fluid, slide
    animation = windowsOut, 1, 5, fluid, slide
    animation = fade, 1, 5, fluid
    animation = workspaces, 1, 5, fluid

    # MANTENHA ESTA LINHA DESATIVADA (COMENTADA)!
    # animation = borderangle, 1, 30, liner, loop
}